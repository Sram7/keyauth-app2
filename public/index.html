<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LeagueCheat - Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;background:#0a0c10;color:#e5e7eb;line-height:1.5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.container{max-width:1200px;width:100%}
.header{text-align:center;margin-bottom:48px}
.logo{font-size:32px;font-weight:700;margin-bottom:8px}
.logo span{background:linear-gradient(135deg,#10b981,#059669);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.tagline{color:#6b7280;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:24px;margin-bottom:32px}
.card{background:#0f1419;border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:32px}
.card h2{font-size:20px;font-weight:600;margin-bottom:20px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;color:#9ca3af;margin-bottom:6px;text-transform:uppercase}
.field input{width:100%;padding:12px 16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#fff;font-size:14px}
.field input:focus{outline:none;border-color:#10b981}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#10b981,#059669);border:none;border-radius:8px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px}
.btn:hover{transform:translateY(-2px)}
.btn-secondary{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.error,.success{padding:12px;border-radius:8px;margin-bottom:16px;font-size:14px;display:none}
.error{background:rgba(248,113,113,.15);border:1px solid rgba(248,113,113,.3);color:#f87171}
.error.show,.success.show{display:block}
.success{background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.3);color:#10b981}
.dashboard{display:none}
.dashboard.show{display:block}
.user-info{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.2);border-radius:12px;padding:20px;margin-bottom:24px}
.user-info h3{font-size:18px;margin-bottom:8px}
.user-info p{color:#6b7280;font-size:14px}
.download-section{text-align:center;padding:32px;background:rgba(16,185,129,.05);border:1px solid rgba(16,185,129,.1);border-radius:12px}
.download-section h3{font-size:20px;margin-bottom:12px}
.download-section p{color:#6b7280;margin-bottom:20px}
.btn-download{display:inline-flex;align-items:center;gap:8px;padding:16px 32px;background:linear-gradient(135deg,#10b981,#059669);border:none;border-radius:8px;color:#fff;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none}
.btn-logout{background:rgba(248,113,113,.15);color:#f87171;padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="container">
<div class="header">
<div class="logo">League<span>Cheat</span></div>
<p class="tagline">BO7 External - Premium Cheat</p>
</div>

<div id="auth-view">
<div class="grid">
<div class="card">
<h2>Create Account</h2>
<div id="register-error" class="error"></div>
<div id="register-success" class="success"></div>
<div class="field">
<label>Username</label>
<input type="text" id="reg-username" placeholder="Enter username">
</div>
<div class="field">
<label>Discord ID</label>
<input type="text" id="reg-discord" placeholder="Enter Discord ID">
</div>
<div class="field">
<label>Password</label>
<input type="password" id="reg-password" placeholder="Enter password">
</div>
<button class="btn" onclick="register()">Create Account</button>
</div>

<div class="card">
<h2>Sign In</h2>
<div id="login-error" class="error"></div>
<div class="field">
<label>Username</label>
<input type="text" id="login-username" placeholder="Enter username">
</div>
<div class="field">
<label>Password</label>
<input type="password" id="login-password" placeholder="Enter password">
</div>
<button class="btn" onclick="login()">Sign In</button>
</div>
</div>
</div>

<div id="dashboard-view" class="dashboard">
<div class="user-info">
<h3 id="welcome-user">Welcome back!</h3>
<p id="user-discord">Discord: Not linked</p>
<button class="btn-logout" onclick="logout()">Sign Out</button>
</div>

<div class="card">
<h2>Activate License</h2>
<div id="key-error" class="error"></div>
<div id="key-success" class="success"></div>
<div class="field">
<label>License Key</label>
<input type="text" id="license-key" placeholder="XXXX-XXXX-XXXX-XXXX">
</div>
<button class="btn" onclick="activateKey()">Activate</button>
</div>

<div id="download-area" class="download-section hidden">
<h3>Download Loader</h3>
<p>Your license is active. Download the loader to start using LeagueCheat.</p>
<a href="/downloads/loader.exe" class="btn-download" download>
<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="width:20px;height:20px">
<path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
</svg>
Download Loader
</a>
</div>
</div>
</div>

<script>
const STORAGE_USER='lc_user';
const STORAGE_SESSION='lc_session';

function showError(id,msg){const el=document.getElementById(id);el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),5000)}
function showSuccess(id,msg){const el=document.getElementById(id);el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),5000)}

function register(){
const username=document.getElementById('reg-username').value.trim();
const discord=document.getElementById('reg-discord').value.trim();
const password=document.getElementById('reg-password').value;
if(!username||!discord||!password){showError('register-error','All fields are required');return}
const users=JSON.parse(localStorage.getItem('lc_users')||'[]');
if(users.find(u=>u.username===username)){showError('register-error','Username already exists');return}
users.push({username,discord,password,hasKey:false,keyActivated:null});
localStorage.setItem('lc_users',JSON.stringify(users));
showSuccess('register-success','Account created! You can now sign in.');
document.getElementById('reg-username').value='';
document.getElementById('reg-discord').value='';
document.getElementById('reg-password').value='';
}

function login(){
const username=document.getElementById('login-username').value.trim();
const password=document.getElementById('login-password').value;
if(!username||!password){showError('login-error','All fields are required');return}
const users=JSON.parse(localStorage.getItem('lc_users')||'[]');
const user=users.find(u=>u.username===username&&u.password===password);
if(!user){showError('login-error','Invalid credentials');return}
sessionStorage.setItem(STORAGE_SESSION,username);
showDashboard(user);
}

function logout(){
sessionStorage.removeItem(STORAGE_SESSION);
document.getElementById('auth-view').classList.remove('hidden');
document.getElementById('dashboard-view').classList.remove('show');
}

function showDashboard(user){
document.getElementById('auth-view').classList.add('hidden');
document.getElementById('dashboard-view').classList.add('show');
document.getElementById('welcome-user').textContent='Welcome, '+user.username+'!';
document.getElementById('user-discord').textContent='Discord: '+user.discord;
if(user.hasKey){
document.getElementById('download-area').classList.remove('hidden');
document.getElementById('key-success').textContent='License active: '+user.keyActivated;
document.getElementById('key-success').classList.add('show');
}
}

function activateKey(){
const key=document.getElementById('license-key').value.trim();
if(!key){showError('key-error','Please enter a license key');return}
const username=sessionStorage.getItem(STORAGE_SESSION);
const users=JSON.parse(localStorage.getItem('lc_users')||'[]');
const user=users.find(u=>u.username===username);
if(!user){showError('key-error','Session expired');return}
const keys=JSON.parse(localStorage.getItem('panel_keys')||'[]');
const keyData=keys.find(k=>k.key_text===key&&!k.revoked);
if(!keyData){showError('key-error','Invalid or revoked license key');return}
const now=new Date().toISOString();
if(keyData.expires_at&&keyData.expires_at<now){showError('key-error','License key expired');return}
user.hasKey=true;
user.keyActivated=key;
keyData.use_count=(keyData.use_count||0)+1;
keyData.last_used_at=now;
localStorage.setItem('lc_users',JSON.stringify(users));
localStorage.setItem('panel_keys',JSON.stringify(keys));
showSuccess('key-success','License activated successfully!');
document.getElementById('download-area').classList.remove('hidden');
}

const session=sessionStorage.getItem(STORAGE_SESSION);
if(session){
const users=JSON.parse(localStorage.getItem('lc_users')||'[]');
const user=users.find(u=>u.username===session);
if(user)showDashboard(user);
}

document.getElementById('login-password').addEventListener('keypress',function(e){if(e.key==='Enter')login()});
document.getElementById('reg-password').addEventListener('keypress',function(e){if(e.key==='Enter')register()});
document.getElementById('license-key').addEventListener('keypress',function(e){if(e.key==='Enter')activateKey()});
</script>
</body>
</html>
