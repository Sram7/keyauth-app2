<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#0a0c10;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh}
.login{background:#0f1419;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:40px;max-width:400px;width:100%}
h1{margin-bottom:20px;font-size:24px}
h1 span{color:#10b981}
.error{background:rgba(248,113,113,.2);border:1px solid #f87171;padding:12px;border-radius:8px;color:#f87171;margin-bottom:16px;display:none}
.error.show{display:block}
label{display:block;margin-bottom:8px;font-size:14px;color:#9ca3af}
input{width:100%;padding:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#fff;margin-bottom:16px;font-size:14px}
input:focus{outline:none;border-color:#10b981}
button{width:100%;padding:14px;background:#10b981;border:none;border-radius:8px;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
button:hover{background:#059669}
.hidden{display:none}
.panel{padding:40px}
.panel h2{margin-bottom:20px}
</style>
</head>
<body>
<div id="login-view" class="login">
<h1>Panel <span>Admin</span></h1>
<div id="error" class="error"></div>
<label>Username</label>
<input type="text" id="user" value="Sramtwo">
<label>Password</label>
<input type="password" id="pass">
<button onclick="login()">Sign In</button>
</div>
<div id="panel-view" class="panel hidden">
<h2>Admin Panel</h2>
<p>Welcome to the admin panel!</p>
<button onclick="logout()">Logout</button>
</div>
<script>
const ADMIN_USER='Sramtwo';
const ADMIN_PASS='Sramtwo12378698999264706786546452345646';
function login(){
const u=document.getElementById('user').value.trim();
const p=document.getElementById('pass').value;
const e=document.getElementById('error');
console.log('Attempting login with:', u, 'Password length:', p.length);
console.log('Expected password:', ADMIN_PASS);
console.log('Match:', p===ADMIN_PASS);
if(u!==ADMIN_USER||p!==ADMIN_PASS){
e.textContent='Invalid credentials';
e.classList.add('show');
return;
}
e.classList.remove('show');
document.getElementById('login-view').classList.add('hidden');
document.getElementById('panel-view').classList.remove('hidden');
}
function logout(){
document.getElementById('login-view').classList.remove('hidden');
document.getElementById('panel-view').classList.add('hidden');
}
document.getElementById('pass').addEventListener('keypress',function(e){
if(e.key==='Enter')login();
});
</script>
</body>
</html>
