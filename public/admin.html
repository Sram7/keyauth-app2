<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Panel - LeagueCheat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;background:#0a0c10;color:#e5e7eb;line-height:1.5}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{background:#0f1419;border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:48px;max-width:420px;width:100%}
.login-card h1{font-size:24px;font-weight:700;margin-bottom:8px}
.login-card h1 span{background:linear-gradient(135deg,#10b981,#059669);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.login-card p{color:#6b7280;margin-bottom:32px}
.login-card label{display:block;font-size:13px;font-weight:600;color:#9ca3af;margin-bottom:8px;text-transform:uppercase}
.login-card input{width:100%;padding:12px 16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#fff;font-size:14px;margin-bottom:20px}
.login-card input:focus{outline:none;border-color:#10b981}
.error{padding:12px;background:rgba(248,113,113,.15);border:1px solid rgba(248,113,113,.3);border-radius:8px;color:#f87171;margin-bottom:20px;display:none}
.error.show{display:block}
.btn-submit{width:100%;padding:14px;background:linear-gradient(135deg,#10b981,#059669);border:none;border-radius:8px;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.btn-submit:hover{transform:translateY(-2px)}
.layout{display:flex;min-height:100vh}
.sidebar{width:240px;background:#0f1419;border-right:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;position:fixed;height:100vh;left:0;top:0}
.logo{padding:20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.06)}
.logo-text{font-size:16px;font-weight:700}
.nav{flex:1;padding:16px 12px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:#9ca3af;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;margin-bottom:4px}
.nav-item:hover{background:rgba(16,185,129,.1);color:#10b981}
.nav-item.active{background:rgba(16,185,129,.15);color:#10b981}
.user-section{padding:16px;border-top:1px solid rgba(255,255,255,.06)}
.btn-logout{width:100%;margin-top:8px;padding:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#9ca3af;font-size:13px;cursor:pointer}
.main{flex:1;margin-left:240px;padding:32px}
.header{margin-bottom:32px}
.header h1{font-size:28px;font-weight:700;margin-bottom:4px}
.header p{font-size:14px;color:#6b7280}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:32px}
.stat-card{background:#0f1419;border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:20px}
.stat-value{font-size:32px;font-weight:700;margin-bottom:4px}
.stat-label{font-size:14px;color:#6b7280}
.card{background:#0f1419;border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:24px;margin-bottom:24px}
.toolbar{display:flex;gap:12px;margin-bottom:20px}
.btn{padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none}
.btn-primary{background:linear-gradient(135deg,#10b981,#059669);color:#fff}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;color:#6b7280;margin-bottom:6px}
.field input,.field select{width:100%;padding:10px 12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#fff;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:12px;background:rgba(255,255,255,.03);color:#6b7280;font-weight:600;font-size:12px;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,.06)}
td{padding:12px;border-bottom:1px solid rgba(255,255,255,.06);color:#9ca3af}
tr:hover td{background:rgba(255,255,255,.02)}
.badge{display:inline-block;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600}
.badge-ok{background:rgba(16,185,129,.15);color:#10b981}
.badge-revoked{background:rgba(248,113,113,.15);color:#f87171}
.hidden{display:none!important}
.section{display:none}
.section.active{display:block}
</style>
</head>
<body>
