<!DOCTYPE html>
<html lang='fr'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width,initial-scale=1.0'>
<title>Admin Panel</title>
<link href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap' rel='stylesheet'>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;background:#0a0c10;color:#e5e7eb;line-height:1.5}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#0f1419;border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:48px;max-width:420px;width:100%}
h1{font-size:24px;font-weight:700;margin-bottom:8px}
h1 span{background:linear-gradient(135deg,#10b981,#059669);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
p{color:#6b7280;margin-bottom:32px}
label{display:block;font-size:13px;font-weight:600;color:#9ca3af;margin-bottom:8px;text-transform:uppercase}
input{width:100%;padding:12px 16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#fff;font-size:14px;margin-bottom:20px}
input:focus{outline:none;border-color:#10b981}
.error{padding:12px;background:rgba(248,113,113,.15);border:1px solid rgba(248,113,113,.3);border-radius:8px;color:#f87171;margin-bottom:20px;display:none}
.error.show{display:block}
button{width:100%;padding:14px;background:linear-gradient(135deg,#10b981,#059669);border:none;border-radius:8px;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
button:hover{transform:translateY(-2px)}
.panel{display:none;padding:32px}
.panel.show{display:block}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:32px}
.stat{background:#0f1419;border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:20px}
.stat-value{font-size:32px;font-weight:700;margin-bottom:4px}
.stat-label{font-size:14px;color:#6b7280}
table{width:100%;border-collapse:collapse;background:#0f1419;border-radius:12px}
th{text-align:left;padding:12px;background:rgba(255,255,255,.03);color:#6b7280;font-size:12px;text-transform:uppercase}
td{padding:12px;border-top:1px solid rgba(255,255,255,.06)}
.btn{padding:6px 12px;background:rgba(16,185,129,.15);color:#10b981;border:none;border-radius:6px;cursor:pointer;font-size:12px;margin-right:8px}
.btn-danger{background:rgba(248,113,113,.15);color:#f87171}
.hidden{display:none}
</style>
</head>
<body>
<div id='login' class='login'>
<div class='card'>
<h1>Panel <span>Admin</span></h1>
<p>Connecte-toi avec ton identifiant et ton mot de passe.</p>
<div id='error' class='error'></div>
<label>Utilisateur</label>
<input type='text' id='user' value='Sramtwo'>
<label>Mot de passe</label>
<input type='password' id='pass'>
<button onclick='login()'>Connexion</button>
</div>
</div>
<div id='panel' class='panel'>
<h1>Tableau de bord</h1>
<div class='stats'>
<div class='stat'><div class='stat-value' id='total'>0</div><div class='stat-label'>Total</div></div>
<div class='stat'><div class='stat-value' id='active'>0</div><div class='stat-label'>Actives</div></div>
<div class='stat'><div class='stat-value' id='revoked'>0</div><div class='stat-label'>Révoquées</div></div>
<div class='stat'><div class='stat-value' id='expired'>0</div><div class='stat-label'>Expirées</div></div>
</div>
<button onclick='createKey()' style='margin-bottom:20px'>Créer une clé</button>
<table><thead><tr><th>Clé</th><th>Statut</th><th>Actions</th></tr></thead><tbody id='tbody'></tbody></table>
</div>
<script>
const ADMIN_USER='Sramtwo';
const ADMIN_PASS='SramtwoSramtwo12378698999264706786546452345646';
function login(){
const u=document.getElementById('user').value;
const p=document.getElementById('pass').value;
const e=document.getElementById('error');
if(u!==ADMIN_USER||p!==ADMIN_PASS){
e.textContent='Identifiants incorrects';
e.classList.add('show');
return;
}
document.getElementById('login').classList.add('hidden');
document.getElementById('panel').classList.add('show');
loadKeys();
}
function getKeys(){
try{return JSON.parse(localStorage.getItem('keys')||'[]')}catch(e){return[]}
}
function saveKeys(k){
localStorage.setItem('keys',JSON.stringify(k));
}
function loadKeys(){
const keys=getKeys();
document.getElementById('total').textContent=keys.length;
document.getElementById('active').textContent=keys.filter(k=>!k.revoked).length;
document.getElementById('revoked').textContent=keys.filter(k=>k.revoked).length;
document.getElementById('expired').textContent=0;
const tbody=document.getElementById('tbody');
tbody.innerHTML=keys.map((k,i)=>'<tr><td>'+k.key+'</td><td>'+(k.revoked?'Révoquée':'Active')+'</td><td><button class=\"btn\" onclick=\"copyKey('+i+')\">Copy</button><button class=\"btn btn-danger\" onclick=\"deleteKey('+i+')\">Supprimer</button></td></tr>').join('');
}
function createKey(){
const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
let key='';
for(let i=0;i<4;i++){
if(i)key+='-';
for(let j=0;j<4;j++)key+=chars[Math.floor(Math.random()*chars.length)];
}
const keys=getKeys();
keys.push({key:key,revoked:false,created:new Date().toISOString()});
saveKeys(keys);
loadKeys();
alert('Clé créée: '+key);
}
function deleteKey(i){
if(!confirm('Supprimer?'))return;
const keys=getKeys();
keys.splice(i,1);
saveKeys(keys);
loadKeys();
}
function copyKey(i){
const keys=getKeys();
navigator.clipboard.writeText(keys[i].key);
alert('Clé copiée');
}
</script>
</body>
</html>
